name: stasy-bell-v2-staging

# Owner-only testing. Public booking is forcibly disabled in every API container.
# Production site and local-development Compose are deliberately independent.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - stasy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: ../../api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ${STASY_ENV_FILE:?absolute private env file}
    environment:
      STASY_PUBLIC_BOOKING_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../api
    restart: unless-stopped
    env_file:
      - ${STASY_ENV_FILE:?absolute private env file}
    environment:
      STASY_PUBLIC_BOOKING_ENABLED: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ../../api
    command: ["python", "-m", "app.expire_worker"]
    restart: unless-stopped
    env_file:
      - ${STASY_ENV_FILE:?absolute private env file}
    environment:
      STASY_PUBLIC_BOOKING_ENABLED: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STASY_API_DOMAIN: ${STASY_API_DOMAIN:?required}
      STASY_ACME_EMAIL: ${STASY_ACME_EMAIL:?required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - stasy_caddy_data:/data
      - stasy_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  stasy_pgdata:
  stasy_caddy_data:
  stasy_caddy_config:
