name: Android cloud acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [develop/stasy-bell-os-v2]
    paths:
      - 'v2/android/**'
      - 'v2/api/**'
      - '.github/workflows/android-cloud-acceptance.yml'
  push:
    branches: [codex/android-cloud-acceptance]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acceptance -d acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://acceptance:synthetic_only@127.0.0.1:5432/acceptance
      JWT_SECRET: synthetic_acceptance_only_signing_key_1234567890
      MASTER_BOOTSTRAP_USERNAME: acceptance_owner
      MASTER_BOOTSTRAP_PASSWORD: synthetic_password_only_123
      STASY_PUBLIC_BOOKING_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start isolated backend
        working-directory: v2/api
        run: |
          set -euo pipefail
          python -m pip install -e .
          alembic upgrade head
          python -m app.bootstrap_owner
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash v2/android/scripts/cloud-acceptance.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cloud-acceptance-evidence
          path: |
            v2/android/acceptance-evidence/
            v2/android/app/build/outputs/androidTest-results/
            v2/android/app/build/reports/androidTests/
            v2/android/app/build/test-results/testDebugUnitTest/
            v2/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/backend.log
          if-no-files-found: warn
          retention-days: 7
