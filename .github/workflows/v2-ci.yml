name: V2 backend checks (no deployment)

on:
  push:
    branches: [develop/stasy-bell-os-v2]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_stasy
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: stasy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_stasy -d stasy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: v2/api
    env:
      DATABASE_URL: postgresql+psycopg://ci_stasy:ci_only_not_a_secret@127.0.0.1:5432/stasy_test
      JWT_SECRET: test_only_signing_key_for_ci_never_use_in_production_12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/api/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests alembic
      - run: alembic upgrade head
      - run: pytest -q
      - name: Prove PostgreSQL backup can be restored (synthetic DB only)
        shell: bash
        run: |
          set -euo pipefail
          # PostgreSQL client tooling runs in the same major version as server.
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            pg_dump -h 127.0.0.1 -U ci_stasy -d stasy_test -Fc > "$RUNNER_TEMP/stasy_ci.dump"
          test -s "$RUNNER_TEMP/stasy_ci.dump"
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_test \
            -c "CREATE DATABASE stasy_restore_test"
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret \
            -v "$RUNNER_TEMP:/backup:ro" postgres:16 \
            pg_restore --exit-on-error --no-owner --no-acl -h 127.0.0.1 -U ci_stasy \
            -d stasy_restore_test /backup/stasy_ci.dump
          restored=$(docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_restore_test \
            -c "SELECT version_num FROM alembic_version")
          test "$restored" = "0003_calendar_snapshot"
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_restore_test \
            -c "SELECT count(*) AS restored_calendar_records FROM calendar_entries"
