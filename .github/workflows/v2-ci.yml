name: V2 backend checks (no deployment)

on:
  push:
    branches: [develop/stasy-bell-os-v2]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches: [main, develop/stasy-bell-os-v2]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_stasy
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: stasy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_stasy -d stasy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: v2/api
    env:
      DATABASE_URL: postgresql+psycopg://ci_stasy:ci_only_not_a_secret@127.0.0.1:5432/stasy_test
      JWT_SECRET: test_only_signing_key_for_ci_never_use_in_production_12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/api/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests alembic
      - run: alembic upgrade head
      - run: pytest -q
      - name: Prove PostgreSQL backup can be restored (synthetic DB only)
        shell: bash
        run: |
          set -euo pipefail
          # PostgreSQL client tooling runs in the same major version as server.
          # Restore must recover actual synthetic rows, not just an empty schema.
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_test \
            -c "INSERT INTO clients (id, name) VALUES ('11111111-1111-4111-8111-111111111111', 'CI_BACKUP_MARKER_FAKE')"
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            pg_dump -h 127.0.0.1 -U ci_stasy -d stasy_test -Fc > "$RUNNER_TEMP/stasy_ci.dump"
          test -s "$RUNNER_TEMP/stasy_ci.dump"
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_test \
            -c "CREATE DATABASE stasy_restore_test"
          docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret \
            -v "$RUNNER_TEMP:/backup:ro" postgres:16 \
            pg_restore --exit-on-error --no-owner --no-acl -h 127.0.0.1 -U ci_stasy \
            -d stasy_restore_test /backup/stasy_ci.dump
          restored=$(docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_restore_test \
            -c "SELECT version_num FROM alembic_version")
          test "$restored" = "0006_notification_outbox"
          restored_rows=$(docker run --rm --network host -e PGPASSWORD=ci_only_not_a_secret postgres:16 \
            psql -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_stasy -d stasy_restore_test \
            -c "SELECT count(*) FROM clients WHERE id='11111111-1111-4111-8111-111111111111' AND name='CI_BACKUP_MARKER_FAKE'")
          test "$restored_rows" = "1"
          echo "Synthetic client row recovered from backup."

  android:
    name: Android debug build and unit tests (no publication)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile private debug APK and unit tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon -PstasyApiBaseUrl=http://127.0.0.1:8000/
      - name: Keep debug APK for emulator acceptance (never publish to Play)
        uses: actions/upload-artifact@v4
        with:
          name: stasy-bell-v2-emulator-debug
          path: v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  web-v2:
    name: V2 website build and catalog tests (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci
      - name: Type-check V2 only
        run: npx tsc --noEmit --project v2/web/tsconfig.json
      - name: Test prices against live-site catalog
        run: npx vitest run v2/web/src/prices.test.ts --config v2/web/vite.config.ts
      - name: Build separate V2 site (no publish)
        run: npx vite build --config v2/web/vite.config.ts
